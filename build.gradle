buildscript {
    ext.kotlin_version = '1.9.20'
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group = 'org.tinhol.mapper'
version = '0.1-SNAPSHOT'

apply plugin: 'kotlin'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven-publish'

repositories {
    mavenCentral()
}

configurations {
    deployerJars
    sourceArchives
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
    implementation(group: 'commons-io', name: 'commons-io', version: '2.4')
    implementation(group: 'org.docx4j', name: 'docx4j', version: '3.3.6')
    implementation(group: 'com.jayway.jsonpath', name: 'json-path', version: '2.4.0')
    implementation('junit:junit:4.12')
    implementation(group: 'org.apache.maven.wagon', name: 'wagon-http', version: '1.0-beta-2')
}

tasks.register('sourceJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

artifacts {
    archives sourceJar
}

def uploadUrl = rootProject.hasProperty('uploadUrl') ? rootProject['uploadUrl'] : ''
def uploadUser = rootProject.hasProperty('uploadUser') ? rootProject['uploadUser'] : ''
def uploadPassword = rootProject.hasProperty('uploadPassword') ? rootProject['uploadPassword'] : ''

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mapper-core'
            from components.java
        }
    }
    repositories {
        maven {
            url = uploadUrl
            credentials {
                username = uploadUser
                password = uploadPassword
            }
        }
    }
}